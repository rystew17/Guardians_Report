[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guards-report"
version = "0.1.0"
description = "Daily scouting report / game preview for Cleveland Guardians games"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "google-cloud-bigquery>=3.25",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Windows ships no IANA time zone database, so zoneinfo cannot resolve
    # "America/New_York" without this. Every clock time in the report is
    # Eastern, so it is a hard requirement, not a convenience.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
guards-report = "guards_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guards_report = ["report/templates/*.html", "report/assets/*", "store/views/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Network tests are excluded by default so the offline suite stays fast and
# deterministic. Run them explicitly with: pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: hits live source APIs; validates our math against published values",
]
