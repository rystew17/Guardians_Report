[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guards-report"
version = "0.1.0"
description = "Daily scouting report / game preview for Cleveland Guardians games"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "google-cloud-bigquery>=3.25",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Windows ships no IANA time zone database, so zoneinfo cannot resolve
    # "America/New_York" without this. Every clock time in the report is
    # Eastern, so it is a hard requirement, not a convenience.
    "tzdata>=2024.1",
    # Draws the link preview card. X renders a shared link image-first and
    # falls back to printing the bare URL when there is no image, so this is
    # what makes a published report unfurl on X at all. The report still builds
    # without it -- the card is skipped and the link degrades to a text card.
    "pillow>=10.0",

    # Everything below was present in the development environment and absent
    # from this list, which is a difference that never shows locally: the
    # imports resolve because the packages are installed, whatever the manifest
    # claims. Installed from this file alone -- which is what a container does
    # -- the app served its own page and failed on anything touching a model.
    "pandas>=2.2",
    "numpy>=1.26",
    # Read directly by the talent model (sparse) and the evaluators (stats).
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Not imported by name anywhere: pandas needs it to read a parquet file, so
    # it is a hard requirement that no import scan will ever find.
    "pyarrow>=16.0",
    # A different distribution from google-cloud-bigquery despite the shared
    # namespace, and the one that publishing and the data sync actually use.
    "google-cloud-storage>=2.18",
    "markupsafe>=2.1",
]

[project.optional-dependencies]
# The written-analysis path that calls a language model. Off by default and
# reached only behind `--with-analysis`, so a deployment that computes its prose
# -- which is every normal one -- does not need it installed.
llm = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8.0"]

[project.scripts]
guards-report = "guards_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The app's own page is packaged too. Left out, every local run worked --
# the file was simply on disk beside the source -- and the installed
# container had no page to serve, which is a 500 on the first request and
# nothing visible before that.
guards_report = [
    "app/*.html",
    "report/templates/*.html",
    "report/assets/*",
    "store/views/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Network tests are excluded by default so the offline suite stays fast and
# deterministic. Run them explicitly with: pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: hits live source APIs; validates our math against published values",
]
